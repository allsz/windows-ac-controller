<svg class="ac-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250"
 role="img" aria-label="Ar-condicionado ligado">
<style>
.ac-root{--louver:35deg;--air:#7dd3fc;--period:2.2s}
.ac-flap{transform-box:fill-box;transform-origin:50% 50%;
  transform:scaleY(max(.1,cos(var(--louver))));
  transition:transform .9s cubic-bezier(.4,0,.2,1)}
.ac-flap.ac-swing{animation:ac-sw 4.2s ease-in-out infinite alternate}
@keyframes ac-sw{from{transform:scaleY(.94)}to{transform:scaleY(.14)}}
.ac-soft{fill:none;stroke:#7dd3fc;stroke-width:15;stroke-linecap:butt;
  stroke-dasharray:80 50;opacity:.30;animation:ac-flow calc(var(--period)*1.5) linear infinite}
.ac-veil{animation:ac-breath calc(var(--period)*2) ease-in-out infinite alternate}
.ac-air{}
.ac-tick{animation:ac-pulse 2.6s ease-in-out infinite}
.ac-soft.alt{opacity:.46}
@keyframes ac-flow{to{stroke-dashoffset:-130}}
@keyframes ac-breath{from{opacity:.5}to{opacity:1}}
@keyframes ac-swayx{from{transform:translate(-4px,114px)}to{transform:translate(4px,114px)}}
@keyframes ac-pulse{50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){.ac-soft,.ac-veil,.ac-flap,.ac-tick,.ac-air{animation:none!important}}
</style>
<defs>
  <linearGradient id="ac-body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef0f4"/>
  </linearGradient>
  <linearGradient id="ac-lip" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dfe2e8"/><stop offset="1" stop-color="#c9cdd6"/>
  </linearGradient>
  <linearGradient id="ac-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#cfd4dc" stop-opacity="0"/><stop offset=".5" stop-color="#cfd4dc"/><stop offset="1" stop-color="#cfd4dc" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ac-slot" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d0f14"/><stop offset="1" stop-color="#1c1f28"/>
  </linearGradient>
  <linearGradient id="ac-flapg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e1e4ea"/>
  </linearGradient>
  <linearGradient id="ac-veilg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7dd3fc" stop-opacity=".32"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ac-shadow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#000000" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- soft drop shadow -->
<rect x="22" y="24" width="356" height="96" rx="20" fill="url(#ac-shadow)"/>

<!-- corpo -->
<g>
  <path d="M30 94 H370 V104 Q370 116 358 116 H42 Q30 116 30 104 Z" fill="url(#ac-lip)"/>
  <rect x="20" y="14" width="360" height="86" rx="18" fill="url(#ac-body)"/>
</g>
<rect x="20.5" y="14.5" width="359" height="85" rx="17.5" fill="none" stroke="#fff" stroke-opacity=".85"/>
<rect x="56" y="76.5" width="288" height="1.2" fill="url(#ac-line)"/>
<rect x="196.3" y="83.5" width="1.5" height="4.5" rx=".75" fill="#7dd3fc" class="ac-tick" transform="rotate(-22 197.05 88.0)"/><rect x="199.25" y="82" width="1.5" height="6" rx=".75" fill="#7dd3fc" class="ac-tick" transform="rotate(0 200.0 88)"/><rect x="202.2" y="83.5" width="1.5" height="4.5" rx=".75" fill="#7dd3fc" class="ac-tick" transform="rotate(22 202.95 88.0)"/>

<!-- saída de ar -->
<rect x="46" y="102" width="308" height="10" rx="5" fill="url(#ac-slot)"/>
<g class="ac-flap" >
  <rect x="48" y="103.5" width="304" height="7" rx="3.5" fill="url(#ac-flapg)"/>
  <rect x="98.7" y="103.5" width=".9" height="7" fill="#bcc2cc"/><rect x="149.3" y="103.5" width=".9" height="7" fill="#bcc2cc"/><rect x="250.7" y="103.5" width=".9" height="7" fill="#bcc2cc"/><rect x="301.3" y="103.5" width=".9" height="7" fill="#bcc2cc"/><rect x="199.1" y="103.5" width="1.8" height="7" fill="#aab1bd"/>
</g>
<g transform="skewX(-5) translate(3.41 0)"><g fill="#fff" opacity=".95" transform="translate(.8 .9)"><rect x="336.90" y="39.00" width="7.50" height="2.50" rx="1.25"/><rect x="343.40" y="40.75" width="2.50" height="7.25" rx="1.25"/><rect x="336.90" y="47.25" width="7.50" height="2.50" rx="1.25"/><rect x="335.40" y="49.00" width="2.50" height="7.25" rx="1.25"/><rect x="336.90" y="55.50" width="7.50" height="2.50" rx="1.25"/><rect x="357.50" y="40.75" width="2.50" height="7.25" rx="1.25"/><rect x="357.50" y="49.00" width="2.50" height="7.25" rx="1.25"/><circle cx="364.6" cy="41.6" r="1.9" fill="none" stroke="#fff" stroke-width="1.3"/></g><g fill="#4aa8d8" class="ac-num"><rect x="336.90" y="39.00" width="7.50" height="2.50" rx="1.25"/><rect x="343.40" y="40.75" width="2.50" height="7.25" rx="1.25"/><rect x="336.90" y="47.25" width="7.50" height="2.50" rx="1.25"/><rect x="335.40" y="49.00" width="2.50" height="7.25" rx="1.25"/><rect x="336.90" y="55.50" width="7.50" height="2.50" rx="1.25"/><rect x="357.50" y="40.75" width="2.50" height="7.25" rx="1.25"/><rect x="357.50" y="49.00" width="2.50" height="7.25" rx="1.25"/><circle cx="364.6" cy="41.6" r="1.9" fill="none" stroke="#4aa8d8" stroke-width="1.3"/></g></g>

<g class="ac-air" transform="translate(0 114)">
  <path class="ac-veil" d="M48 0 L198 0 L197.5 90.0 L10.7 90.0 Z" fill="url(#ac-veilg)"/>
  <path class="ac-veil" d="M202 0 L352 0 L389.3 90.0 L202.5 90.0 Z" fill="url(#ac-veilg)"/>
  <path class="ac-soft" d="M56.0 0 L20.6 90.0" fill="none" stroke="#7dd3fc" stroke-width="15" stroke-linecap="butt" stroke-dasharray="80 50" style="animation-delay:-0.00s"/><path class="ac-soft alt" d="M88.0 0 L60.5 90.0" fill="none" stroke="#7dd3fc" stroke-width="15" stroke-linecap="butt" stroke-dasharray="80 50" style="animation-delay:-0.61s"/><path class="ac-soft" d="M120.0 0 L100.4 90.0" fill="none" stroke="#7dd3fc" stroke-width="15" stroke-linecap="butt" stroke-dasharray="80 50" style="animation-delay:-1.22s"/><path class="ac-soft alt" d="M152.0 0 L140.2 90.0" fill="none" stroke="#7dd3fc" stroke-width="15" stroke-linecap="butt" stroke-dasharray="80 50" style="animation-delay:-1.83s"/><path class="ac-soft" d="M184.0 0 L180.1 90.0" fill="none" stroke="#7dd3fc" stroke-width="15" stroke-linecap="butt" stroke-dasharray="80 50" style="animation-delay:-0.24s"/><path class="ac-soft alt" d="M216.0 0 L219.9 90.0" fill="none" stroke="#7dd3fc" stroke-width="15" stroke-linecap="butt" stroke-dasharray="80 50" style="animation-delay:-0.85s"/><path class="ac-soft" d="M248.0 0 L259.8 90.0" fill="none" stroke="#7dd3fc" stroke-width="15" stroke-linecap="butt" stroke-dasharray="80 50" style="animation-delay:-1.46s"/><path class="ac-soft alt" d="M280.0 0 L299.6 90.0" fill="none" stroke="#7dd3fc" stroke-width="15" stroke-linecap="butt" stroke-dasharray="80 50" style="animation-delay:-2.07s"/><path class="ac-soft" d="M312.0 0 L339.5 90.0" fill="none" stroke="#7dd3fc" stroke-width="15" stroke-linecap="butt" stroke-dasharray="80 50" style="animation-delay:-0.48s"/><path class="ac-soft alt" d="M344.0 0 L379.4 90.0" fill="none" stroke="#7dd3fc" stroke-width="15" stroke-linecap="butt" stroke-dasharray="80 50" style="animation-delay:-1.09s"/>
</g>
</svg>